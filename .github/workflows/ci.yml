# Every push and pull request: the relay is formatted, lint-free, and tested, runs end to end
# against stand-ins for Apple's and Google's push services, and builds for x86-64 and ARM against
# Debian 12 (scripts/baseline_build.py), each build kept as an artifact.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    name: Format, lint, test, and run end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_PASSWORD: aspen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev postgresql-client python3-pip
          pip install --break-system-packages cryptography
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/e2e.py

  baseline:
    name: ${{ matrix.arch }} (Debian 12) — build against the baseline and start
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm pkg-config
      - name: Rust (the toolchain rust-toolchain.toml pins)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: baseline-${{ matrix.arch }}
          cache-directories: target/cross
      - name: Set up, build, and check
        run: python3 scripts/baseline_build.py --arch ${{ matrix.arch }}
      - name: Package
        run: |
          mkdir dist
          cp "$(python3 scripts/baseline_build.py --arch ${{ matrix.arch }} out)/aspen-push-relay" dist/
          tar -C dist -czf aspen-push-relay-${{ matrix.arch }}-bookworm.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: aspen-push-relay-${{ matrix.arch }}-bookworm
          path: aspen-push-relay-${{ matrix.arch }}-bookworm.tar.gz
